name: Publish to Exchange + Home
on:
  push:
    branches: [develop]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Anypoint CLI v4
        run: |
          npm install -g anypoint-cli-v4@latest
          anypoint-cli-v4 --version

      - name: Login Anypoint CLI
        run: |
          anypoint-cli-v4 conf username ${{ secrets.ANYPOINT_USERNAME }}
          anypoint-cli-v4 conf password ${{ secrets.ANYPOINT_PASSWORD }}
          anypoint-cli-v4 conf organization ${{ secrets.ANYPOINT_ORG_ID }}

      - name: Create RAML ZIP
        run: zip -r apispec.zip mi-api.raml

      - name: Create docs ZIP  
        run: |
          mkdir docs
          cp home.md docs/
          cd docs && zip -r ../docs.zip . && cd ..

      - name: Publish asset + Home
        run: |
          anypoint-cli-v4 exchange:asset:upload \
            --name "publish2Exchange" \
            --type "rest-api" \
            --properties '{"apiVersion":"v1","mainFile":"mi-api.raml"}' \
            --files '{"raml.zip":"apispec.zip","docs.zip":"docs.zip"}' \
            com.example/publish2Exchange/1.1.3
