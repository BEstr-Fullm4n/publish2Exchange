name: Publish Asset to Exchange

on:
  push:
    branches: [develop]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create asset ZIP
        run: |
          zip -r asset-complete.zip . -x "*/.git*" "*.github*" "README.md"
          echo "Contenido del ZIP:"
          unzip -l asset-complete.zip

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Get Access Token
        id: token
        run: |
          RESPONSE=$(curl -s -X POST https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token \
            -d "client_id=${{ secrets.ANYPOINT_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.ANYPOINT_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials")
          echo "token=$(echo $RESPONSE | jq -r .access_token)" >> $GITHUB_ENV

      - name: Publish new version to Exchange
        run: |
          ORG_ID="${{ secrets.ANYPOINT_ORG_ID }}"
          GROUP_ID="com.example"
          ASSET_ID="publish2Exchange"
          VERSION="1.1.0"
          ZIP_FILE="asset-complete.zip"
          
          curl -v -X POST \
            "https://anypoint.mulesoft.com/exchange/api/v2/organizations/$ORG_ID/assets/$GROUP_ID/$ASSET_ID/$VERSION" \  # ✅ CORRECTO
            -H "Authorization: Bearer ${{ env.token }}" \
            -H "x-sync-publication: true" \
            -F "name=$ASSET_ID" \
            -F "type=rest-api" \
            -F 'properties={"apiVersion":"v1","mainFile":"api/mi-api.raml"}' \
            -F "file=@$ZIP_FILE"
