name: Publish to Exchange + Home
on:
  push:
    branches: [develop]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # PASO 1: RAML con action original (FUNCIONA)
      - uses: josedagama/mulesoft-exchange-upload@1.0.0
        with:
          anypoint-username: ${{ secrets.ANYPOINT_USERNAME }}
          anypoint-password: ${{ secrets.ANYPOINT_PASSWORD }}
          anypoint-organization-id: ${{ secrets.ANYPOINT_ORG_ID }}

      # PASO 2: Home.md con endpoint CORRECTO
      - name: Upload Home.md
        run: |
          # Obtener token
          TOKEN=$(curl -s -X POST https://anypoint.mulesoft.com/accounts/api/v2/oauth2/token \
            -d "client_id=${{ secrets.ANYPOINT_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.ANYPOINT_CLIENT_SECRET }}" \
            -d "grant_type=client_credentials" | jq -r .access_token)
          
          # ZIP docs con estructura correcta
          mkdir -p docs
          cp home.md docs/
          cd docs && zip -r ../docs.zip . && cd ..
          
          echo "Token: ${TOKEN:0:10}..."
          
          # ENDPOINT CORRECTO para docs (PATCH mutabledata)
          curl -v -X PATCH \
            "https://anypoint.mulesoft.com/exchange/api/v2/organizations/${{ secrets.ANYPOINT_ORG_ID }}/assets/com.example/publish2Exchange/1.1.4/mutabledata" \
            -H "Authorization: Bearer $TOKEN" \
            -F "files.docs.zip=@docs.zip"
