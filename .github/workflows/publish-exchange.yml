name: Publish to Exchange

on:
  push:
    branches: [develop]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Create complete asset ZIP
        run: |
          zip -r asset-complete.zip . -x "*/.git*" "*.github*" "README.md"
          echo "Contenido del ZIP:"
          unzip -l asset-complete.zip

      - name: Validate required files
        run: |
          unzip -l asset-complete.zip | grep exchange.json
          unzip -l asset-complete.zip | grep home.md
          unzip -l asset-complete.zip | grep .raml

      - name: Install Anypoint CLI
        run: npm install -g anypoint-cli-v4

      - name: Publish to Exchange
        run: |
          anypoint-cli-v4 exchange:asset:upload \
            --organizationId ${{ secrets.ANYPOINT_ORG_ID }} \
            --username ${{ secrets.ANYPOINT_USERNAME }} \
            --password ${{ secrets.ANYPOINT_PASSWORD }} \
            --files '["asset-complete.zip"]'